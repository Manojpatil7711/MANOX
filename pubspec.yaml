name: manox
description: MANOX - A global creator-first platform.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  go_router: ^16.0.0
  image_picker: ^1.1.2
  share_plus: ^12.0.2

dependency_overrides:
  # supabase_flutter uses app_links internally. Pin to the last app_links
  # line compatible with this project's AGP 8.x / Gradle 8.11.1 toolchain.
  # app_links 7.1+ moved its Android example/tooling to AGP 9.x.
  app_links: 6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
