name: APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
      JAVA_TOOL_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Android API 36
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Clean Flutter and Gradle state
        run: |
          set -euxo pipefail
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee flutter-build.log
          ANALYZE_EXIT=${PIPESTATUS[0]}
          echo "Flutter analyze exit code: $ANALYZE_EXIT" | tee -a flutter-build.log
          exit "$ANALYZE_EXIT"

      - name: Flutter tests
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee -a flutter-build.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "Flutter test exit code: $TEST_EXIT" | tee -a flutter-build.log
          exit "$TEST_EXIT"

      - name: Remove legacy generated plugin file
        run: |
          set -euxo pipefail
          find android/app/src/main -type f -name "GeneratedPluginRegistrant.java" -delete

      - name: Verify Gradle configuration
        run: |
          set -euxo pipefail
          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --version --no-daemon

      - name: Verify production signing guard
        run: |
          set -euxo pipefail
          ! grep -q 'signingConfig signingConfigs.debug' android/app/build.gradle
          grep -q 'MANOX_KEYSTORE_PATH' android/app/build.gradle
          grep -q 'Production release signing is not configured' android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          grep -q '^version: 1.0.0+1$' pubspec.yaml

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          printf '\n===== FLUTTER BUILD APK =====\n' | tee -a flutter-build.log
          flutter build apk --debug --verbose 2>&1 | tee -a flutter-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Flutter build exit code: $BUILD_EXIT" | tee -a flutter-build.log
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "================ ROOT-CAUSE ERROR SUMMARY ================" | tee -a flutter-build.log
            grep -nEi '(^|[[:space:]])(error:|exception:|failure:|failed|could not|unable|gradle build failed|apk file|unexpected)' flutter-build.log | tail -n 80 || true
            echo "================ LAST 250 LOG LINES ================" | tee -a flutter-build.log
            tail -n 250 flutter-build.log || true
          fi
          exit "$BUILD_EXIT"

      - name: Upload complete Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manox-full-build-log
          path: flutter-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        if: success()
        run: |
          set -euxo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK successfully generated:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manox-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build Production AAB
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.MANOX_KEYSTORE_BASE64 != '' && secrets.MANOX_KEYSTORE_PASSWORD != '' && secrets.MANOX_KEY_ALIAS != '' && secrets.MANOX_KEY_PASSWORD != '' }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
      JAVA_TOOL_OPTIONS: "-Xmx4096m"
      MANOX_KEYSTORE_PASSWORD: ${{ secrets.MANOX_KEYSTORE_PASSWORD }}
      MANOX_KEY_ALIAS: ${{ secrets.MANOX_KEY_ALIAS }}
      MANOX_KEY_PASSWORD: ${{ secrets.MANOX_KEY_PASSWORD }}
      MANOX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/manox-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode production keystore
        env:
          MANOX_KEYSTORE_BASE64: ${{ secrets.MANOX_KEYSTORE_BASE64 }}
        run: |
          set -euxo pipefail
          printf '%s' "$MANOX_KEYSTORE_BASE64" | base64 --decode > "$MANOX_KEYSTORE_PATH"
          test -s "$MANOX_KEYSTORE_PATH"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build signed production AAB
        run: flutter build appbundle --release

      - name: Verify production AAB
        run: |
          set -euxo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"
          file "$AAB"

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: manox-production-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
