name: APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Remove legacy generated plugin registration
        run: |
          set -euxo pipefail
          find android/app/src/main -type f -name 'GeneratedPluginRegistrant.java' -delete
          test ! -e android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          if git ls-files | grep -Fx 'android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java' >/dev/null 2>&1; then
            echo 'ERROR: GeneratedPluginRegistrant.java is still Git-tracked.'
            exit 1
          fi

      - name: Verify resolved app_links version
        run: |
          set -euxo pipefail
          flutter pub deps --style=compact | grep 'app_links' || true

      - name: Verify Gradle configuration
        run: |
          set -euxo pipefail
          grep -q 'gradle-8.11.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application' android/settings.gradle
          grep -q 'dev.flutter.flutter-plugin-loader' android/settings.gradle
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          grep -q 'VERSION_17' android/app/build.gradle

      - name: Clean
        run: flutter clean

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          file build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
