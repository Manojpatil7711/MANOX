name: APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
      JAVA_TOOL_OPTIONS: "-Xmx4096m"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Fix Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Clean Flutter and Gradle state
        run: |
          set -euxo pipefail
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Remove legacy generated plugin file
        run: |
          set -euxo pipefail
          find android/app/src/main -type f -name "GeneratedPluginRegistrant.java" -delete

      - name: Verify Gradle configuration
        run: |
          set -euxo pipefail
          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --version --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug --verbose 2>&1 | tee "$GITHUB_WORKSPACE/flutter-build.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Flutter build exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "================ ROOT-CAUSE ERROR SUMMARY ================"
            grep -nEi '(^|[[:space:]])(error:|exception:|failure:|failed|could not|unable|gradle build failed|apk file|unexpected)' "$GITHUB_WORKSPACE/flutter-build.log" | tail -n 80 || true
            echo "================ LAST 250 LOG LINES ================"
            tail -n 250 "$GITHUB_WORKSPACE/flutter-build.log" || true
          fi

          exit "$BUILD_EXIT"

      - name: Upload complete Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manox-full-build-log
          path: flutter-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify APK
        if: success()
        run: |
          set -euxo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK successfully generated:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manox-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
