plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.manox"
    // AndroidX 1.17.0 / browser 1.9.0 require compileSdk 36+.
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.manox"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("MANOX_KEYSTORE_PATH")
            def keystorePassword = System.getenv("MANOX_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("MANOX_KEY_ALIAS")
            def keyPassword = System.getenv("MANOX_KEY_PASSWORD")

            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                this.keyAlias keyAlias
                this.keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            // Never use the debug keystore for a production MANOX build.
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Keep debug/CI builds usable without production credentials, while hard-failing
// any actual release artifact build when the production keystore is missing.
tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease']) {
        task.doFirst {
            def required = [
                "MANOX_KEYSTORE_PATH",
                "MANOX_KEYSTORE_PASSWORD",
                "MANOX_KEY_ALIAS",
                "MANOX_KEY_PASSWORD"
            ]
            def missing = required.findAll { !System.getenv(it) }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Production release signing is not configured. Missing environment variables: " + missing.join(', ')
                )
            }
            def configuredPath = System.getenv("MANOX_KEYSTORE_PATH")
            if (!file(configuredPath).exists()) {
                throw new GradleException("MANOX_KEYSTORE_PATH does not point to an existing keystore file.")
            }
        }
    }
}

flutter {
    source '../..'
}
