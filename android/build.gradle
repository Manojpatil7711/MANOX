allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep the Android/Gradle build output inside the Flutter repository.
// From android/, ../build resolves to <repo>/build, which is where
// Flutter expects app-debug.apk and other generated artifacts.
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
